name: Flutter Test

on:
  push:
    branches:
      - main
      - develop
      - feature/id/*/*

jobs:
  test:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        package:
          - monolith
          - monolith_define
          - monolith_install
          - monolith_localization
          - monolith_localization_runtime
          - monolith_runner
          - monolith_xcodegen

    steps:
      # 最初にリポジトリをチェックアウトする
      - name: checkout repository
        uses: actions/checkout@v7

      # mise で .mise.toml のツール（Flutter 3.50.0）を入れる
      - name: install tools (mise)
        uses: jdx/mise-action@v5

      # 導入された Flutter 版をログに残す（ローカルと CI の突合用）
      - name: show flutter version
        run: |
          echo "flutter version: $(flutter --version)"
          echo "flutter path: $(which flutter)"
          echo "dart version: $(dart --version)"
          echo "dart path: $(which dart)"

      # テスト
      - name: flutter test - ${{ matrix.package }}
        run: |
          cp pubspec.yaml.template pubspec.yaml
          cd ${{ matrix.package }}
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
          dart format --set-exit-if-changed ./lib/
          dart format --set-exit-if-changed ./test/
          flutter test ./test/
