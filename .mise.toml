[tools]
flutter = "3.50.0"

[tasks.setup]
description = "Setup Repository"
depends = []
run = """
chmod +x scripts/setup.sh
scripts/setup.sh
"""

[tasks."monolith:apm:install"]
description = "Install APM skills for Cursor (--refresh --force)"
run = "apm install --refresh --force --target cursor"

[tasks."monolith:monolith:publish"]
description = "Publish monolith to pub.dev"
usage = '''
flag "--dry-run" help="Validate package without uploading to pub.dev"
'''
run = """
dart pub -C monolith publish ${usage_dry_run:+--dry-run}
"""

